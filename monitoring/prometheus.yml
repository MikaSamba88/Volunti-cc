
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus scrape config
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

#Swarm node metrics - Host
#Exporter

  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - 'tasks.node-exporter'
        type: 'A'
        port: 9100

# Swarm node metrics - Container
# Exporter

  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.cadvisor'
        type: 'A'
        port: 8080

