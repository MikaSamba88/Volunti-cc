
monitor-check:
  stage: lint
  image: docker:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes:
        - monitoring/**/*
        - deploy.py
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      changes:
        - monitoring/**/*
        - ddeploy.py
  script:
    - cd monitoring
    - docker compose -f monitor-stack.yml config

monitor-deploy:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes:
        - monitoring/**/*
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
      changes:
        - monitoring/**/*
  variables:
    STACK_NAME: monitoring
    COMPOSE_FILE: monitoring/monitor-stack.yml
  before_script:
    - pip install requests
  script:
    - python deploy.py
