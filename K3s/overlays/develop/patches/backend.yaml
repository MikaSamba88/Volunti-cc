apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunti-backend
spec:
  template:
    spec:
      containers:
        - name: volunti-backend
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=burgundy-dev-mssql-service,1433;Database=volunti;User Id=sa;Password=$(MSSQL_SA_PASSWORD);TrustServerCertificate=true"
            - name: Jwt__Issuer
              value: "https://dev-volunti-api.cc.k3s.chas-lab.dev"
            - name: Jwt__Audience
              value: "https://dev-volunti.cc.k3s.chas-lab.dev"
