apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: volunti-basic-auth
spec:
  basicAuth:
    secret: adminer-basic-auth

---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "same-origin"


---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-re-routing
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
