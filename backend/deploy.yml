backend-deploy:
  stage: deploy
  image: python:3.10-alpine
  variables:
    STACK_NAME: "volunti-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"
    PUBLIC_HOST: "volunti-$CI_COMMIT_REF_SLUG"
    SUBSTITUTE_VARS: "true"
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      variables:
        PUBLIC_HOST: "volunti"
        STACK_NAME: "volunti-$CI_DEFAULT_BRANCH"
    - if: '$CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      variables:
        PUBLIC_HOST: "volunti-$CI_COMMIT_REF_SLUG"
        STACK_NAME: "volunti-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"
  script:
    - pip install requests
    - python deploy.py 
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://${PUBLIC_HOST}.doe25.swarm.chas-lab.dev/docs
    on_stop: stop_review

stop_review:
  stage: cleanup
  image: python:3.10-slim
  script:
    - pip install requests
    - python delete.py
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  allow_failure: true
